name: ci

on:
  push: {}
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test-build:
    name: Go test and build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          cache: true

      - name: Check formatting
        run: make fmt-check

      - name: Run go vet
        run: make vet

      - name: Run tests
        run: make test

      - name: Run race detector
        run: make test-race

      - name: Build services
        run: make build

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Build community web client
        run: npm ci --prefix web && npm run build --prefix web

      - name: Validate frontend contracts
        run: make frontend-static-check

      - name: Validate documentation structure
        run: make docs-check

      - name: Validate fault handling contract
        run: make fault-check

      - name: Validate Docker Compose config
        run: |
          make compose-config
          make compose-cn-config
          make compose-light-config
          make compose-light-cn-config
          make observability-config
          make observability-cn-config
          docker compose -f docker-compose.yml -f docker-compose.community.yml -f docker-compose.observability.yml config --quiet

      - name: Validate Prometheus config and alert rules
        run: make prometheus-check

  docker-build:
    name: Docker image build
    runs-on: ubuntu-latest
    needs: test-build
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: false
          tags: linkgo-im:${{ github.sha }}
          build-args: |
            GO_BUILDER_IMAGE=golang:1.25-alpine
            RUNTIME_IMAGE=alpine:3.22

  manifest-check:
    name: Kubernetes manifest render
    runs-on: ubuntu-latest
    needs: test-build
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up kubectl
        uses: azure/setup-kubectl@v4
        with:
          version: v1.31.0

      - name: Render manifests
        run: |
          bash -n scripts/k8s_release.sh
          bash scripts/validate_k8s.sh
          kubectl kustomize deploy/k8s --load-restrictor LoadRestrictionsNone > /tmp/linkgo-im-k8s.yaml
          grep -q "kind: Deployment" /tmp/linkgo-im-k8s.yaml
          grep -q "kind: HorizontalPodAutoscaler" /tmp/linkgo-im-k8s.yaml
          grep -q "kind: NetworkPolicy" /tmp/linkgo-im-k8s.yaml

  deliver-image:
    # Manual image publication only. No production cluster is wired to CI.
    if: github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main'
    needs: [test-build, docker-build, manifest-check]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v6
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Publish reviewed SHA image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ghcr.io/${{ github.repository }}/linkgo-im:${{ github.sha }}
          build-args: |
            GO_BUILDER_IMAGE=golang:1.25-alpine
            RUNTIME_IMAGE=alpine:3.22
