services:
  etcd:
    image: ${ETCD_IMAGE:-quay.io/coreos/etcd:v3.5.15}
    container_name: linkgo-next-etcd
    command:
      - /usr/local/bin/etcd
      - --name=etcd0
      - --advertise-client-urls=http://etcd:2379
      - --listen-client-urls=http://0.0.0.0:2379
    ports:
      - "${LINKGO_ETCD_PORT:-2379}:2379"

  zookeeper:
    image: ${ZOOKEEPER_IMAGE:-confluentinc/cp-zookeeper:7.6.0}
    container_name: linkgo-next-zookeeper
    environment:
      ZOOKEEPER_CLIENT_PORT: 2181
      ZOOKEEPER_TICK_TIME: 2000

  kafka:
    image: ${KAFKA_IMAGE:-confluentinc/cp-kafka:7.6.0}
    container_name: linkgo-next-kafka
    # A stale ZooKeeper broker session can reject the first startup. Retry
    # after the session expires; an explicit `docker stop` still stays stopped.
    restart: unless-stopped
    depends_on:
      - zookeeper
    ports:
      - "${LINKGO_KAFKA_PORT:-9092}:9092"
    environment:
      KAFKA_BROKER_ID: 1
      KAFKA_ZOOKEEPER_CONNECT: zookeeper:2181
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092
      KAFKA_LISTENERS: PLAINTEXT://0.0.0.0:9092
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1

  redis:
    image: ${REDIS_IMAGE:-redis:7-alpine}
    container_name: linkgo-next-redis
    ports:
      - "${LINKGO_REDIS_PORT:-6379}:6379"
    command: redis-server --requirepass 123456

  mysql:
    image: ${MYSQL_IMAGE:-mysql:8.0}
    container_name: linkgo-next-mysql
    ports:
      - "${LINKGO_MYSQL_PORT:-3306}:3306"
    environment:
      - MYSQL_ROOT_PASSWORD=root
      - MYSQL_DATABASE=linkgo_im
      - MARIADB_ROOT_PASSWORD=root
      - MARIADB_DATABASE=linkgo_im
    volumes:
      - ./sql/init.sql:/docker-entrypoint-initdb.d/init.sql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-proot"]
      timeout: 20s
      retries: 10

  logic:
    build:
      context: .
      args:
        GO_BUILDER_IMAGE: ${GO_BUILDER_IMAGE:-golang:1.25-alpine}
        RUNTIME_IMAGE: ${RUNTIME_IMAGE:-alpine:3.22}
    container_name: linkgo-next-logic
    command: ./logic
    ports:
      - "${LINKGO_LOGIC_HEALTH_PORT:-9002}:9002"
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_started
      etcd:
        condition: service_started
      kafka:
        condition: service_started
    environment:
      - REDIS_ADDR=redis:6379
      - REDIS_PASSWORD=123456
      - DB_DSN=root:root@tcp(mysql:3306)/linkgo_im?charset=utf8mb4&parseTime=True&loc=Local
      - DB_MAX_OPEN_CONNS=50
      - DB_MAX_IDLE_CONNS=10
      - LOGIC_HEALTH_PORT=9002
      - ETCD_ENDPOINTS=etcd:2379
      - KAFKA_BROKERS=kafka:9092
      - KAFKA_GROUP_TOPIC=group_message_dispatch
      - AI_PROVIDER=${AI_PROVIDER:-mock}
      - AI_MODEL=${AI_MODEL:-}
      - AI_BASE_URL=${AI_BASE_URL:-}
      - AI_API_KEY=${AI_API_KEY:-}
      - DEEPSEEK_API_KEY=${DEEPSEEK_API_KEY:-}
      - AI_TIMEOUT_SECONDS=${AI_TIMEOUT_SECONDS:-10}
      - AI_FALLBACK_TO_MOCK=${AI_FALLBACK_TO_MOCK:-true}
      - AI_BOT_USER_ID=${AI_BOT_USER_ID:-9001}
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://localhost:9002/healthz"]
      interval: 10s
      timeout: 3s
      retries: 5

  logic-b:
    build:
      context: .
      args:
        GO_BUILDER_IMAGE: ${GO_BUILDER_IMAGE:-golang:1.25-alpine}
        RUNTIME_IMAGE: ${RUNTIME_IMAGE:-alpine:3.22}
    container_name: linkgo-next-logic-b
    command: ./logic
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_started
      etcd:
        condition: service_started
      kafka:
        condition: service_started
    environment:
      - REDIS_ADDR=redis:6379
      - REDIS_PASSWORD=123456
      - DB_DSN=root:root@tcp(mysql:3306)/linkgo_im?charset=utf8mb4&parseTime=True&loc=Local
      - DB_MAX_OPEN_CONNS=50
      - DB_MAX_IDLE_CONNS=10
      - LOGIC_HEALTH_PORT=9002
      - ETCD_ENDPOINTS=etcd:2379
      - KAFKA_BROKERS=kafka:9092
      - KAFKA_GROUP_TOPIC=group_message_dispatch
      - AI_PROVIDER=${AI_PROVIDER:-mock}
      - AI_MODEL=${AI_MODEL:-}
      - AI_BASE_URL=${AI_BASE_URL:-}
      - AI_API_KEY=${AI_API_KEY:-}
      - DEEPSEEK_API_KEY=${DEEPSEEK_API_KEY:-}
      - AI_TIMEOUT_SECONDS=${AI_TIMEOUT_SECONDS:-10}
      - AI_FALLBACK_TO_MOCK=${AI_FALLBACK_TO_MOCK:-true}
      - AI_BOT_USER_ID=${AI_BOT_USER_ID:-9001}
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://localhost:9002/healthz"]
      interval: 10s
      timeout: 3s
      retries: 5

  transfer:
    build:
      context: .
      args:
        GO_BUILDER_IMAGE: ${GO_BUILDER_IMAGE:-golang:1.25-alpine}
        RUNTIME_IMAGE: ${RUNTIME_IMAGE:-alpine:3.22}
    container_name: linkgo-next-transfer
    command: ./transfer
    ports:
      - "${LINKGO_TRANSFER_PORT:-9102}:9102"
    depends_on:
      - redis
      - kafka
    environment:
      - REDIS_ADDR=redis:6379
      - REDIS_PASSWORD=123456
      - KAFKA_BROKERS=kafka:9092
      - KAFKA_GROUP_TOPIC=group_message_dispatch
      - KAFKA_RETRY_TOPIC=group_message_retry
      - KAFKA_DLQ_TOPIC=group_message_dlq
      - KAFKA_CONSUMER_GROUP=transfer-group
      - TRANSFER_METRICS_PORT=9102
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://localhost:9102/healthz"]
      interval: 10s
      timeout: 3s
      retries: 5

  gateway-a:
    build:
      context: .
      args:
        GO_BUILDER_IMAGE: ${GO_BUILDER_IMAGE:-golang:1.25-alpine}
        RUNTIME_IMAGE: ${RUNTIME_IMAGE:-alpine:3.22}
    container_name: linkgo-next-gateway-a
    command: ./gateway
    ports:
      - "${LINKGO_GATEWAY_BIND_ADDR:-127.0.0.1}:${LINKGO_GATEWAY_A_PORT:-8090}:8090"
    depends_on:
      - logic
      - logic-b
      - redis
      - etcd
    environment:
      - LINKGO_UPLOAD_DIR=/app/uploads
      - GATEWAY_PORT=8090
      - GATEWAY_ID=gateway-a
      - WS_ALLOWED_ORIGINS=${LINKGO_WS_ALLOWED_ORIGINS:-https://localhost:8443,https://127.0.0.1:8443,http://127.0.0.1:8088,http://localhost:8088}
      - REDIS_ADDR=redis:6379
      - REDIS_PASSWORD=123456
      - DB_DSN=root:root@tcp(mysql:3306)/linkgo_im?charset=utf8mb4&parseTime=True&loc=Local
      - DB_MAX_OPEN_CONNS=30
      - DB_MAX_IDLE_CONNS=10
      - ETCD_ENDPOINTS=etcd:2379
      - AI_PROVIDER=${AI_PROVIDER:-mock}
      - AI_MODEL=${AI_MODEL:-}
      - AI_BASE_URL=${AI_BASE_URL:-}
      - AI_API_KEY=${AI_API_KEY:-}
      - DEEPSEEK_API_KEY=${DEEPSEEK_API_KEY:-}
      - AI_TIMEOUT_SECONDS=${AI_TIMEOUT_SECONDS:-10}
      - AI_FALLBACK_TO_MOCK=${AI_FALLBACK_TO_MOCK:-true}
    volumes:
      - linkgo-uploads:/app/uploads
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://localhost:8090/healthz"]
      interval: 10s
      timeout: 3s
      retries: 5

  gateway-b:
    build:
      context: .
      args:
        GO_BUILDER_IMAGE: ${GO_BUILDER_IMAGE:-golang:1.25-alpine}
        RUNTIME_IMAGE: ${RUNTIME_IMAGE:-alpine:3.22}
    container_name: linkgo-next-gateway-b
    command: ./gateway
    ports:
      - "${LINKGO_GATEWAY_BIND_ADDR:-127.0.0.1}:${LINKGO_GATEWAY_B_PORT:-8091}:8090"
    depends_on:
      - logic
      - logic-b
      - redis
      - etcd
    environment:
      - LINKGO_UPLOAD_DIR=/app/uploads
      - GATEWAY_PORT=8090
      - GATEWAY_ID=gateway-b
      - WS_ALLOWED_ORIGINS=${LINKGO_WS_ALLOWED_ORIGINS:-https://localhost:8443,https://127.0.0.1:8443,http://127.0.0.1:8088,http://localhost:8088}
      - REDIS_ADDR=redis:6379
      - REDIS_PASSWORD=123456
      - DB_DSN=root:root@tcp(mysql:3306)/linkgo_im?charset=utf8mb4&parseTime=True&loc=Local
      - DB_MAX_OPEN_CONNS=30
      - DB_MAX_IDLE_CONNS=10
      - ETCD_ENDPOINTS=etcd:2379
      - AI_PROVIDER=${AI_PROVIDER:-mock}
      - AI_MODEL=${AI_MODEL:-}
      - AI_BASE_URL=${AI_BASE_URL:-}
      - AI_API_KEY=${AI_API_KEY:-}
      - DEEPSEEK_API_KEY=${DEEPSEEK_API_KEY:-}
      - AI_TIMEOUT_SECONDS=${AI_TIMEOUT_SECONDS:-10}
      - AI_FALLBACK_TO_MOCK=${AI_FALLBACK_TO_MOCK:-true}
    volumes:
      - linkgo-uploads:/app/uploads
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://localhost:8090/healthz"]
      interval: 10s
      timeout: 3s
      retries: 5

  gateway-c:
    build:
      context: .
      args:
        GO_BUILDER_IMAGE: ${GO_BUILDER_IMAGE:-golang:1.25-alpine}
        RUNTIME_IMAGE: ${RUNTIME_IMAGE:-alpine:3.22}
    container_name: linkgo-next-gateway-c
    command: ./gateway
    ports:
      - "${LINKGO_GATEWAY_BIND_ADDR:-127.0.0.1}:${LINKGO_GATEWAY_C_PORT:-8092}:8090"
    depends_on:
      - logic
      - logic-b
      - redis
      - etcd
    environment:
      - LINKGO_UPLOAD_DIR=/app/uploads
      - GATEWAY_PORT=8090
      - GATEWAY_ID=gateway-c
      - WS_ALLOWED_ORIGINS=${LINKGO_WS_ALLOWED_ORIGINS:-https://localhost:8443,https://127.0.0.1:8443,http://127.0.0.1:8088,http://localhost:8088}
      - REDIS_ADDR=redis:6379
      - REDIS_PASSWORD=123456
      - DB_DSN=root:root@tcp(mysql:3306)/linkgo_im?charset=utf8mb4&parseTime=True&loc=Local
      - DB_MAX_OPEN_CONNS=30
      - DB_MAX_IDLE_CONNS=10
      - ETCD_ENDPOINTS=etcd:2379
      - AI_PROVIDER=${AI_PROVIDER:-mock}
      - AI_MODEL=${AI_MODEL:-}
      - AI_BASE_URL=${AI_BASE_URL:-}
      - AI_API_KEY=${AI_API_KEY:-}
      - DEEPSEEK_API_KEY=${DEEPSEEK_API_KEY:-}
      - AI_TIMEOUT_SECONDS=${AI_TIMEOUT_SECONDS:-10}
      - AI_FALLBACK_TO_MOCK=${AI_FALLBACK_TO_MOCK:-true}
    volumes:
      - linkgo-uploads:/app/uploads
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://localhost:8090/healthz"]
      interval: 10s
      timeout: 3s
      retries: 5

volumes:
  linkgo-uploads:
