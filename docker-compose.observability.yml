services:
  prometheus:
    image: ${PROMETHEUS_IMAGE:-prom/prometheus:v2.55.1}
    container_name: linkgo-next-prometheus
    depends_on:
      gateway-a:
        condition: service_started
      gateway-b:
        condition: service_started
      gateway-c:
        condition: service_started
      transfer:
        condition: service_started
    ports:
      - "9090:9090"
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.path=/prometheus
      - --web.console.libraries=/usr/share/prometheus/console_libraries
      - --web.console.templates=/usr/share/prometheus/consoles
    volumes:
      - ./deploy/observability/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ./deploy/observability/rules:/etc/prometheus/rules:ro

  grafana:
    image: ${GRAFANA_IMAGE:-grafana/grafana:11.3.0}
    container_name: linkgo-next-grafana
    depends_on:
      prometheus:
        condition: service_started
    ports:
      - "3000:3000"
    environment:
      - GF_SECURITY_ADMIN_USER=admin
      - GF_SECURITY_ADMIN_PASSWORD=linkgo
      - GF_USERS_ALLOW_SIGN_UP=false
      - GF_ANALYTICS_REPORTING_ENABLED=false
      - GF_ANALYTICS_CHECK_FOR_UPDATES=false
    volumes:
      - ./deploy/observability/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./deploy/observability/grafana/dashboards:/var/lib/grafana/dashboards:ro

  loki:
    image: ${LOKI_IMAGE:-grafana/loki:3.4.2}
    command: -config.file=/etc/loki/config.yml
    ports:
      - "127.0.0.1:3100:3100"
    volumes:
      - ./deploy/observability/loki/config.yml:/etc/loki/config.yml:ro
      - linkgo-loki:/loki
  alloy:
    image: ${ALLOY_IMAGE:-grafana/alloy:v1.8.3}
    command: run --storage.path=/var/lib/alloy /etc/alloy/config.alloy
    volumes:
      - ./deploy/observability/alloy/config.alloy:/etc/alloy/config.alloy:ro
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - linkgo-alloy:/var/lib/alloy
    depends_on:
      - loki
  alertmanager:
    image: ${ALERTMANAGER_IMAGE:-prom/alertmanager:v0.28.1}
    command: --config.file=/etc/alertmanager/config.yml
    ports:
      - "127.0.0.1:9093:9093"
    volumes:
      - ./deploy/observability/alertmanager/config.yml:/etc/alertmanager/config.yml:ro
  gateway-a:
    environment:
      ALERT_WEBHOOK_TOKEN: linkgo-local-alert
volumes:
  linkgo-loki:
  linkgo-alloy:
