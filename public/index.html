<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>LinkGo Chat</title>
    <style>
        :root {
            --bg: #f3f5f7;
            --panel: #ffffff;
            --panel-soft: #f8fafc;
            --line: #d9e0e7;
            --text: #17202a;
            --muted: #65758b;
            --brand: #1677ff;
            --brand-weak: #e7f1ff;
            --ai: #7c3aed;
            --money: #f97316;
            --ok: #18a058;
            --warn: #d97706;
            --bad: #d92d20;
            --chat: #eef2f6;
            --self: #dff5d8;
            --other: #ffffff;
        }

        * { box-sizing: border-box; }

        body {
            margin: 0;
            height: 100vh;
            min-height: 720px;
            overflow-x: hidden;
            color: var(--text);
            background: var(--bg);
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "Microsoft YaHei", sans-serif;
            letter-spacing: 0;
        }

        button, input, select, textarea {
            font: inherit;
        }

        button {
            height: 32px;
            border: 1px solid var(--line);
            border-radius: 6px;
            background: #fff;
            color: var(--text);
            cursor: pointer;
            padding: 0 12px;
            white-space: nowrap;
        }

        button:hover { border-color: var(--brand); color: var(--brand); }
        button.primary { border-color: var(--brand); background: var(--brand); color: #fff; }
        button.primary:hover { background: #0f68e8; color: #fff; }
        button.danger:hover { border-color: var(--bad); color: var(--bad); }
        button.ghost { background: transparent; }
        .task-panel { border-bottom: 1px solid var(--line); padding: 10px 16px; background: #f8fbff; max-height: 46vh; overflow: auto; }
        .task-panel[hidden] { display: none; }
        .task-panel summary { cursor: pointer; font-weight: 700; }
        .task-panel .row { margin: 8px 0; }
        .task-card { background: white; border: 1px solid var(--line); border-radius: 8px; padding: 10px; margin: 8px 0; }
        .task-card button { margin: 4px; }
        .task-muted { color: var(--muted); font-size: 12px; }
        .task-panel textarea { min-height: 65px; }

        input, select, textarea {
            width: 100%;
            border: 1px solid var(--line);
            border-radius: 6px;
            background: #fff;
            color: var(--text);
            outline: none;
        }

        input, select { height: 32px; padding: 0 10px; }
        textarea { resize: none; padding: 10px 12px; line-height: 1.45; }
        input:focus, select:focus, textarea:focus { border-color: var(--brand); box-shadow: 0 0 0 2px var(--brand-weak); }

        .shell {
            height: 100%;
            display: grid;
            grid-template-rows: 56px minmax(0, 1fr);
        }

        .topbar {
            display: grid;
            grid-template-columns: 220px 180px 88px 120px 120px 110px 150px;
            gap: 10px;
            align-items: center;
            justify-content: start;
            padding: 10px 16px;
            border-bottom: 1px solid var(--line);
            background: var(--panel);
        }

        .topbar > * {
            min-width: 0;
        }

        .brand {
            display: flex;
            align-items: center;
            gap: 10px;
            min-width: 190px;
            font-weight: 700;
        }

        .brand-mark {
            width: 30px;
            height: 30px;
            border-radius: 6px;
            display: grid;
            place-items: center;
            background: var(--brand);
            color: #fff;
            font-size: 14px;
        }

        .status {
            justify-self: stretch;
            width: 100%;
            height: 32px;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
            border: 1px solid var(--line);
            border-radius: 999px;
            background: var(--panel-soft);
            color: var(--muted);
            font-size: 13px;
        }

        .dot {
            width: 8px;
            height: 8px;
            border-radius: 50%;
            background: var(--bad);
        }

        .workspace {
            min-height: 0;
            min-width: 0;
            display: grid;
            grid-template-columns: 340px minmax(0, 1fr);
            gap: 12px;
            padding: 12px;
        }

        .side, .chat {
            min-height: 0;
            min-width: 0;
            background: var(--panel);
            border: 1px solid var(--line);
            border-radius: 8px;
            overflow: hidden;
        }

        .side {
            display: grid;
            grid-template-rows: auto auto auto minmax(0, 1fr);
        }

        .section {
            border-bottom: 1px solid var(--line);
            padding: 12px;
        }

        .section-title {
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 8px;
            margin-bottom: 10px;
            font-size: 13px;
            color: var(--muted);
            font-weight: 700;
        }

        .grid-2 {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 8px;
        }

        .grid-3 {
            display: grid;
            grid-template-columns: 1fr 92px 74px;
            gap: 8px;
        }

        .row {
            display: flex;
            gap: 8px;
            align-items: center;
        }

        .row + .row, .grid-2 + .row, .grid-3 + .row, .field + .field {
            margin-top: 8px;
        }

        .tabs {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 6px;
            padding: 8px 12px;
            border-bottom: 1px solid var(--line);
            background: var(--panel-soft);
        }

        .tab {
            height: 30px;
            border-radius: 6px;
            font-size: 13px;
        }

        .tab.active {
            border-color: var(--brand);
            background: var(--brand-weak);
            color: var(--brand);
        }

        .list-wrap {
            min-height: 0;
            overflow: auto;
        }

        .list {
            display: none;
        }

        .list.active {
            display: block;
        }

        .item {
            min-height: 56px;
            display: grid;
            grid-template-columns: 36px minmax(0, 1fr) auto;
            gap: 10px;
            align-items: center;
            padding: 10px 12px;
            border-bottom: 1px solid #edf1f5;
            cursor: pointer;
        }

        .item:hover { background: var(--panel-soft); }
        .item.active { background: var(--brand-weak); }

        .avatar {
            width: 36px;
            height: 36px;
            border-radius: 6px;
            display: grid;
            place-items: center;
            background: #3b82f6;
            color: #fff;
            font-size: 12px;
            font-weight: 700;
        }

        .avatar.group { background: #0f766e; }
        .avatar.ai { background: var(--ai); }
        .avatar.req { background: #0f766e; }

        .title {
            overflow: hidden;
            white-space: nowrap;
            text-overflow: ellipsis;
            font-size: 14px;
            font-weight: 650;
        }

        .sub {
            margin-top: 3px;
            overflow: hidden;
            white-space: nowrap;
            text-overflow: ellipsis;
            color: var(--muted);
            font-size: 12px;
        }

        .mini-actions {
            display: flex;
            gap: 6px;
        }

        .mini-actions button {
            height: 28px;
            padding: 0 8px;
            font-size: 12px;
        }

        .chat {
            display: grid;
            grid-template-rows: 58px minmax(0, 1fr) 150px 132px;
        }

        .chat:has(.task-panel:not([hidden])) {
            grid-template-rows: 58px auto minmax(0, 1fr) 150px 132px;
        }

        .chat-head {
            display: grid;
            grid-template-columns: 280px 112px 150px 86px 86px;
            gap: 8px;
            align-items: center;
            justify-content: start;
            padding: 12px;
            border-bottom: 1px solid var(--line);
        }

        .chat-head > * {
            min-width: 0;
        }

        .target-label {
            display: flex;
            align-items: center;
            gap: 8px;
            min-width: 0;
            font-weight: 700;
        }

        .target-name {
            overflow: hidden;
            white-space: nowrap;
            text-overflow: ellipsis;
        }

        .badge {
            display: inline-flex;
            align-items: center;
            height: 22px;
            padding: 0 8px;
            border-radius: 999px;
            background: var(--panel-soft);
            border: 1px solid var(--line);
            color: var(--muted);
            font-size: 12px;
            font-weight: 500;
        }

        .badge.ai {
            border-color: #ddd6fe;
            background: #f3efff;
            color: var(--ai);
        }

        .badge.money {
            border-color: #fed7aa;
            background: #fff7ed;
            color: var(--money);
        }

        .messages {
            min-height: 0;
            overflow: auto;
            padding: 16px;
            background: var(--chat);
        }

        .empty {
            height: 100%;
            min-height: 120px;
            display: grid;
            place-items: center;
            color: var(--muted);
            font-size: 13px;
        }

        .msg {
            display: flex;
            gap: 8px;
            margin-bottom: 12px;
            max-width: 78%;
        }

        .msg.self {
            flex-direction: row-reverse;
            margin-left: auto;
        }

        .msg.system {
            max-width: 100%;
            justify-content: center;
        }

        .bubble {
            padding: 9px 11px;
            border: 1px solid var(--line);
            border-radius: 8px;
            background: var(--other);
            line-height: 1.45;
            word-break: break-word;
            white-space: pre-wrap;
        }

        .self .bubble {
            background: var(--self);
            border-color: #c5e8bb;
        }

        .system .bubble {
            background: rgba(255,255,255,0.72);
            color: var(--muted);
            font-size: 12px;
        }

        .meta {
            margin-bottom: 4px;
            color: var(--muted);
            font-size: 12px;
        }

        .self .meta { text-align: right; }

        .composer {
            border-top: 1px solid var(--line);
            background: var(--panel);
            padding: 12px;
            display: grid;
            grid-template-columns: minmax(0, 1fr) 112px 112px;
            grid-template-rows: 36px 1fr;
            gap: 8px;
        }

        .composer textarea {
            grid-column: 1 / 4;
            height: 78px;
        }

        .logs {
            border-top: 1px solid var(--line);
            background: #101828;
            color: #d0d5dd;
            overflow: auto;
            font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
            font-size: 12px;
            line-height: 1.55;
            padding: 10px 12px;
        }

        .log-line { white-space: pre-wrap; word-break: break-word; }
        .log-ok { color: #86efac; }
        .log-warn { color: #fde68a; }
        .log-error { color: #fca5a5; }
        .log-info { color: #bfdbfe; }

        .quick-actions {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 8px;
            margin-top: 8px;
        }

        .quick-actions button {
            height: 32px;
        }

        @media (max-width: 980px) {
            body { height: auto; min-height: 100vh; }
            .shell { height: auto; min-height: 100vh; grid-template-rows: auto auto; }
            .topbar { grid-template-columns: 1fr 1fr; }
            .status { justify-self: stretch; }
            .workspace { grid-template-columns: 1fr; }
            .side { min-height: 520px; }
            .chat { min-height: 720px; }
            .chat-head { grid-template-columns: 1fr 96px; grid-auto-rows: 32px; }
            .composer { grid-template-columns: 1fr 1fr; grid-template-rows: 36px 88px 36px; }
            .composer textarea { grid-column: 1 / 3; }
        }
    </style>
</head>
<body>
<div class="shell">
    <header class="topbar">
        <div class="brand">
            <div class="brand-mark">IM</div>
            <div>LinkGo Chat</div>
        </div>
        <input id="host" aria-label="Gateway Host">
        <input id="port" aria-label="Gateway Port" value="8090">
        <input id="username" aria-label="Username" value="userA">
        <input id="password" aria-label="Password" type="password" value="123456">
        <button class="primary" id="login-btn">登录</button>
        <div class="status" id="status"><span class="dot" id="dot"></span><span id="status-text">离线</span></div>
    </header>

    <main class="workspace">
        <aside class="side">
            <section class="section">
                <div class="section-title">
                    <span>账号</span>
                    <button class="ghost" id="ready-btn">readyz</button>
                </div>
                <div class="grid-3">
                    <button data-account="userA">userA</button>
                    <button data-account="userB">userB</button>
                    <button data-account="userC">userC</button>
                </div>
                <div class="quick-actions">
                    <button id="open-peer-btn">打开对聊</button>
                    <button id="open-ai-btn">AI 助手</button>
                    <button id="fill-demo-btn">填充消息</button>
                    <button id="connect-btn">重连 WS</button>
                    <button id="local-data-btn">本地数据</button>
                    <button id="sync-history-btn">补齐历史</button>
                </div>
                <div class="row">
                    <input id="friend-target" placeholder="目标用户ID">
                    <button id="apply-btn">申请</button>
                    <button id="friends-btn">刷新</button>
                </div>
            </section>

            <section class="section">
                <div class="section-title">
                    <span>群组</span>
                    <button class="ghost" id="groups-btn">刷新</button>
                </div>
                <div class="grid-2">
                    <input id="group-id" placeholder="群ID，如 G100">
                    <input id="group-name" placeholder="群名称">
                </div>
                <div class="row">
                    <input id="group-members" placeholder="成员，如 1001,1002">
                    <button id="create-group-btn">创建</button>
                </div>
            </section>

            <section class="section">
                <div class="section-title">
                    <span>站内钱包（模拟支付）</span>
                    <button class="ghost" id="wallet-detail-btn">余额/流水</button>
                </div>
                <div class="grid-2">
                    <input id="wallet-recharge-amount" placeholder="充值金额分，如 1000">
                    <select id="wallet-recharge-channel">
                        <option value="mock_wechat">模拟微信支付</option>
                        <option value="mock_alipay">模拟支付宝</option>
                    </select>
                </div>
                <button id="wallet-recharge-btn">模拟充值到账</button>
            </section>

            <section class="section">
                <div class="section-title">
                    <span>红包</span>
                    <button class="ghost" id="red-packet-detail-btn">详情</button>
                </div>
                <div class="grid-2">
                    <input id="red-packet-amount" placeholder="金额分，如 100">
                    <input id="red-packet-count" placeholder="份数，如 3">
                </div>
                <div class="row">
                    <input id="red-packet-greeting" placeholder="祝福语">
                    <button id="red-packet-create-btn">发红包</button>
                </div>
                <div class="row">
                    <input id="red-packet-id" placeholder="红包ID">
                    <button id="red-packet-claim-btn">抢</button>
                    <button class="ghost" id="red-packet-refund-btn">过期退款</button>
                </div>
            </section>

            <div class="tabs">
                <button class="tab active" data-tab="conversations">会话</button>
                <button class="tab" data-tab="friends">好友</button>
                <button class="tab" data-tab="requests">申请</button>
            </div>
            <div class="list-wrap">
                <div id="conversations-list" class="list active"></div>
                <div id="friends-list" class="list"></div>
                <div id="requests-list" class="list"></div>
            </div>
        </aside>

        <section class="chat">
            <div class="chat-head">
                <div class="target-label">
                    <span class="target-name" id="current-title">未选择会话</span>
                    <span class="badge" id="current-meta">seq 0</span>
                </div>
                <select id="target-type" aria-label="Target Type">
                    <option value="user">私聊</option>
                    <option value="group">群聊</option>
                </select>
                <input id="target-id" placeholder="目标ID">
                <button id="open-chat-btn">打开</button>
                <button id="history-btn" disabled>加载更早</button>
            </div>

            <details class="task-panel" id="task-panel" hidden>
                <summary>学习群任务 <span id="task-group-name"></span></summary>
                <div id="task-status" class="task-muted">请选择群聊</div>
                <div class="row"><button id="task-refresh-btn">刷新任务</button><button id="task-new-btn" hidden>新建草稿</button></div>
                <div id="task-create-form" hidden class="task-card">
                    <input id="task-title" placeholder="任务标题（必填）">
                    <textarea id="task-description" placeholder="任务说明"></textarea>
                    <label>截止时间（可选）<input id="task-due-at" type="datetime-local"></label>
                    <button id="task-create-btn" class="primary">保存草稿</button>
                </div>
                <div id="task-list"></div>
                <div id="task-detail"></div>
            </details>

            <div class="messages" id="messages">
                <div class="empty">登录后选择会话</div>
            </div>

            <div class="composer">
                <input id="client-msg-id" placeholder="clientMsgId 自动生成">
                <button id="attach-file-btn" type="button">上传群文件</button>
                <input id="attach-file-input" type="file" accept="image/*,video/mp4,video/webm,.pdf,.txt,.md,.csv,.docx,.xlsx,.pptx" hidden>
                <button id="send-btn" class="primary">发送</button>
                <button id="resend-btn">重发上条</button>
                <textarea id="message-input" placeholder="输入消息"></textarea>
            </div>

            <div class="logs" id="logs"></div>
        </section>
    </main>
</div>

<script src="./client-store.js"></script>
<script src="./history-sync.js"></script>
<script src="./task-panel.js"></script>
<script>
(() => {
    const textEncoder = new TextEncoder();
    const textDecoder = new TextDecoder();
    const AI_BOT_ID = "9001";
    const AI_BOT_NAME = "ai_assistant";
    const TASK_BOT_ID = "9002";

    const state = {
        token: "",
        userId: "",
        ws: null,
        heartbeatTimer: null,
        reconnectTimer: null,
        reconnectAttempt: 0,
        wsConnectionSerial: 0,
        intentionalClose: false,
        lastPongAt: 0,
        currentTarget: "",
        currentType: "user",
        conversations: new Map(),
        friends: [],
        friendMeta: new Map(),
        requests: [],
        renderedMessageIds: new Set(),
        lastSeqBySession: new Map(),
        lastAckedSeqBySession: new Map(),
        historyCursorBySession: new Map(),
        historyHasMoreBySession: new Map(),
        historyLoadingSessions: new Set(),
        historySyncedSeqBySession: new Map(),
        historySyncReady: false,
        historySyncPromise: null,
        historySyncEpoch: 0,
        historyRequestSerial: 0,
        lastWire: null,
        pendingMessages: new Map(),
        localStoreReady: false
    };

    const $ = (id) => document.getElementById(id);

    $("host").value = defaultGatewayHost();
    if (window.location.protocol === "https:") {
        // The secure demo serves the page and proxies API/WS on one TLS origin.
        $("host").value = window.location.hostname;
        $("port").value = window.location.port || "443";
        $("host").disabled = true;
        $("port").disabled = true;
    }

    function defaultGatewayHost() {
        const host = window.location.hostname || "";
        if (window.location.protocol === "file:" || host === "" || host.includes("$") || host.toLowerCase().includes("wsl")) {
            return "127.0.0.1";
        }
        return host;
    }

    function apiBase() {
        if (window.location.protocol === "https:") return window.location.origin;
        return `http://${$("host").value.trim() || "localhost"}:${$("port").value.trim() || "8090"}`;
    }

    function wsBase() {
        if (window.location.protocol === "https:") return `wss://${window.location.host}`;
        return `ws://${$("host").value.trim() || "localhost"}:${$("port").value.trim() || "8090"}`;
    }

    function nowText() {
        return new Date().toLocaleTimeString("zh-CN", { hour12: false });
    }

    function log(level, message, detail) {
        const logs = $("logs");
        const line = document.createElement("div");
        line.className = `log-line log-${level}`;
        const suffix = detail === undefined ? "" : ` ${formatLogDetail(detail)}`;
        line.textContent = `[${nowText()}] ${message}${suffix}`;
        logs.appendChild(line);
        while (logs.children.length > 120) logs.removeChild(logs.firstChild);
        logs.scrollTop = logs.scrollHeight;
    }

    function formatLogDetail(detail) {
        if (detail instanceof Error) return detail.message.trim();
        if (typeof detail === "string") return detail.trim();
        return safeJson(detail);
    }

    function safeJson(value) {
        try {
            return JSON.stringify(value);
        } catch {
            return String(value);
        }
    }

    function persist(operation, label) {
        Promise.resolve(operation).catch((error) => {
            log("warn", `${label || "本地数据写入"}失败`, error.message || error);
        });
    }

    async function restoreLocalState() {
        if (!state.userId || !window.LinkGoStore) return;
        try {
            await window.LinkGoStore.open();
            const [conversations, cursors, progress] = await Promise.all([
                window.LinkGoStore.listConversations(state.userId),
                window.LinkGoStore.listCursors(state.userId),
                window.LinkGoStore.listSyncProgress(state.userId)
            ]);
            state.localStoreReady = true;
            for (const conversation of conversations) {
                addConversation(conversation.target, conversation.type, conversation);
            }
            for (const cursor of cursors) {
                const lastSeq = Number(cursor.last_seq || 0);
                const ackedSeq = Number(cursor.acked_seq || 0);
                if (lastSeq > (state.lastSeqBySession.get(cursor.session_id) || 0)) {
                    state.lastSeqBySession.set(cursor.session_id, lastSeq);
                }
                if (ackedSeq > (state.lastAckedSeqBySession.get(cursor.session_id) || 0)) {
                    state.lastAckedSeqBySession.set(cursor.session_id, ackedSeq);
                }
            }
            for (const row of progress) {
                state.historySyncedSeqBySession.set(row.session_id, Number(row.synced_seq || 0));
            }
            log("ok", "IndexedDB 本地状态已恢复", {
                conversations: conversations.length,
                cursors: cursors.length,
                synced_conversations: progress.length
            });
        } catch (error) {
            state.localStoreReady = false;
            log("warn", "IndexedDB 不可用，继续使用服务端历史", error.message || error);
        }
    }

    async function renderLocalHistory(sessionID, reason) {
        if (!state.localStoreReady || !state.userId || !sessionID) return false;
        const messages = await window.LinkGoStore.listMessages(state.userId, sessionID);
        if (!messages.length) return false;
        renderMessages(messages);
        log("warn", "已回退到 IndexedDB 本地历史", { reason, count: messages.length });
        return true;
    }

    async function reconcileServerPage(sessionID, serverMessages) {
        if (!state.localStoreReady || !state.userId) return [];
        const localMessages = await window.LinkGoStore.listMessages(state.userId, sessionID);
        const localByID = new Map(localMessages
            .filter((item) => item.message_id)
            .map((item) => [item.message_id, item]));
        const serverByID = new Map(serverMessages
            .filter((item) => item.message_id)
            .map((item) => [item.message_id, item]));
        const localIDs = new Set(localByID.keys());
        const serverIDs = new Set(serverByID.keys());
        const newFromServer = [...serverIDs].filter((id) => !localIDs.has(id)).length;
        const localOutsidePage = [...localIDs].filter((id) => !serverIDs.has(id)).length;
        let matched = 0;
        let conflicts = 0;
        for (const [messageID, serverMessage] of serverByID) {
            const localMessage = localByID.get(messageID);
            if (!localMessage) continue;
            if (Number(localMessage.seq || 0) === Number(serverMessage.seq || 0)
                && String(localMessage.body || "") === String(serverMessage.body || "")) {
                matched++;
            } else {
                conflicts++;
            }
        }
        log("info", "服务端历史与 IndexedDB 当前页对账", {
            server_page: serverMessages.length,
            local_total: localMessages.length,
            matched,
            conflicts,
            new_from_server: newFromServer,
            local_not_in_current_page: localOutsidePage
        });
        return localMessages;
    }

    async function apiFetch(path, options = {}) {
        const headers = new Headers(options.headers || {});
        if (!headers.has("Content-Type") && options.body && typeof options.body !== "string") {
            headers.set("Content-Type", "application/json");
        }
        if (state.token) headers.set("Authorization", `Bearer ${state.token}`);
        const init = { ...options, headers };
        if (init.body && typeof init.body !== "string") init.body = JSON.stringify(init.body);

        let res;
        try {
            res = await fetch(`${apiBase()}${path}`, init);
        } catch (err) {
            throw new Error(`无法连接 Gateway ${apiBase()}，请确认后端已启动且 Host 填 127.0.0.1 或 localhost`);
        }
        const contentType = res.headers.get("content-type") || "";
        let payload = null;
        if (contentType.includes("application/json")) {
            payload = await res.json();
        } else {
            payload = await res.text();
        }
        if (!res.ok) {
            const err = typeof payload === "object" && payload ? (payload.error || payload.message || safeJson(payload)) : payload;
            throw new Error(err || `${res.status} ${res.statusText}`);
        }
        return payload;
    }

    function encodeVarint(value) {
        let n = BigInt(value);
        const bytes = [];
        while (n >= 0x80n) {
            bytes.push(Number((n & 0x7fn) | 0x80n));
            n >>= 7n;
        }
        bytes.push(Number(n));
        return bytes;
    }

    function encodeKey(field, wireType) {
        return encodeVarint((field << 3) | wireType);
    }

    function encodeString(field, value) {
        if (value === undefined || value === null || value === "") return [];
        const bytes = Array.from(textEncoder.encode(String(value)));
        return [...encodeKey(field, 2), ...encodeVarint(bytes.length), ...bytes];
    }

    function encodeInt(field, value, includeZero = false) {
        if (value === undefined || value === null) return [];
        if (!includeZero && Number(value) === 0) return [];
        return [...encodeKey(field, 0), ...encodeVarint(value)];
    }

    function encodeWireMessage(msg) {
        const parts = [
            encodeString(1, msg.message_id),
            encodeString(2, msg.session_id),
            encodeInt(3, msg.seq),
            encodeString(4, msg.from),
            encodeString(5, msg.to),
            encodeString(6, msg.to_type),
            encodeInt(7, msg.msg_type, msg.msg_type !== undefined),
            encodeString(8, msg.body),
            encodeInt(9, msg.sent_at),
            encodeString(10, msg.ack_message_id),
            encodeString(11, msg.client_msg_id),
            encodeString(12, msg.trace_id),
            encodeInt(13, msg.last_seq, msg.last_seq !== undefined)
        ];
        return new Uint8Array(parts.flat());
    }

    function readVarint(bytes, cursor) {
        let shift = 0n;
        let result = 0n;
        while (cursor.pos < bytes.length) {
            const b = bytes[cursor.pos++];
            result |= BigInt(b & 0x7f) << shift;
            if ((b & 0x80) === 0) return result;
            shift += 7n;
        }
        throw new Error("bad varint");
    }

    function skipField(bytes, cursor, wireType) {
        if (wireType === 0) {
            readVarint(bytes, cursor);
            return;
        }
        if (wireType === 1) {
            cursor.pos += 8;
            return;
        }
        if (wireType === 2) {
            const len = Number(readVarint(bytes, cursor));
            cursor.pos += len;
            return;
        }
        if (wireType === 5) {
            cursor.pos += 4;
            return;
        }
        throw new Error(`unsupported wire type ${wireType}`);
    }

    function decodeWireMessage(data) {
        const bytes = data instanceof Uint8Array ? data : new Uint8Array(data);
        const cursor = { pos: 0 };
        const msg = { msg_type: 0 };
        const strings = {
            1: "message_id",
            2: "session_id",
            4: "from",
            5: "to",
            6: "to_type",
            8: "body",
            10: "ack_message_id",
            11: "client_msg_id",
            12: "trace_id"
        };
        const ints = {
            3: "seq",
            7: "msg_type",
            9: "sent_at",
            13: "last_seq"
        };

        while (cursor.pos < bytes.length) {
            const key = Number(readVarint(bytes, cursor));
            const field = key >> 3;
            const wireType = key & 7;
            if (wireType === 2 && strings[field]) {
                const len = Number(readVarint(bytes, cursor));
                msg[strings[field]] = textDecoder.decode(bytes.slice(cursor.pos, cursor.pos + len));
                cursor.pos += len;
                continue;
            }
            if (wireType === 0 && ints[field]) {
                msg[ints[field]] = Number(readVarint(bytes, cursor));
                continue;
            }
            skipField(bytes, cursor, wireType);
        }
        return msg;
    }

    function buildSessionId(target, type) {
        if (!target) return "";
        if (type === "group") return `group:${target}`;
        return ["c2c", ...[state.userId, target].sort()].join(":");
    }

    function sessionOfMessage(msg) {
        if (msg.session_id) return msg.session_id;
        const type = msg.to_type || (String(msg.to || "").startsWith("G") ? "group" : "user");
        return buildSessionId(type === "group" ? msg.to : peerOfMessage(msg), type);
    }

    function peerOfMessage(msg) {
        if ((msg.to_type || "") === "group") return msg.to;
        return msg.from === state.userId ? msg.to : msg.from;
    }

    function isAIUser(id) {
        return String(id || "") === AI_BOT_ID;
    }

    function displayName(id, fallback = "") {
        if (isAIUser(id)) return AI_BOT_NAME;
        if (String(id || "") === TASK_BOT_ID) return "学习任务助手";
        const meta = state.friendMeta.get(String(id || ""));
        return meta && meta.username ? meta.username : (fallback || id || "");
    }

    function setCurrent(target, type) {
        state.currentTarget = target;
        state.currentType = type || (String(target).startsWith("G") ? "group" : "user");
        const sessionID = buildSessionId(target, state.currentType);
        state.historyCursorBySession.delete(sessionID);
        state.historyHasMoreBySession.delete(sessionID);
        updateHistoryButton(sessionID);
        $("target-id").value = target;
        $("target-type").value = state.currentType;
        const name = state.currentType === "group" ? target : displayName(target);
        $("current-title").textContent = target ? `${state.currentType === "group" ? "群聊" : "私聊"} ${name}` : "未选择会话";
        updateCurrentMeta();
        renderLists();
        window.LinkGoTasks.setGroup(state.currentType === "group" ? target : "");
    }

    function updateCurrentMeta() {
        const sessionID = buildSessionId(state.currentTarget, state.currentType);
        const lastSeq = state.lastSeqBySession.get(sessionID) || 0;
        $("current-meta").textContent = `seq ${lastSeq}`;
    }

    function addConversation(target, type, meta = {}) {
        if (!target) return;
        const realType = type || (String(target).startsWith("G") ? "group" : "user");
        const key = `${realType}:${target}`;
        const prev = state.conversations.get(key) || {};
        const conversation = { ...prev, ...meta, target, type: realType };
        state.conversations.set(key, conversation);
        if (state.localStoreReady && state.userId) {
            persist(window.LinkGoStore.putConversation(state.userId, conversation), "保存本地会话");
        }
    }

    function targetFromConversation(conv) {
        const id = conv.conversation_id || conv.id || "";
        const type = conv.type || (id.startsWith("group:") ? "group" : "user");
        if (type === "group") return id.startsWith("group:") ? id.slice(6) : id;
        const parts = id.split(":");
        if (parts[0] === "c2c") return parts.find((part) => part && part !== "c2c" && part !== state.userId) || "";
        return id;
    }

    function renderMessage(msg, options = {}) {
        const box = $("messages");
        if (box.querySelector(".empty")) box.innerHTML = "";
        const messageID = msg.message_id || msg.client_msg_id;
        if (messageID && state.renderedMessageIds.has(messageID)) return;
        if (messageID) state.renderedMessageIds.add(messageID);

        const sessionID = sessionOfMessage(msg);
        if (!options.skipPersist && state.localStoreReady && state.userId && sessionID) {
            persist(
                window.LinkGoStore.putMessage(
                    state.userId,
                    sessionID,
                    msg,
                    options.pending ? "pending" : (msg.status || "received")
                ),
                "保存本地消息"
            );
        }
        if (msg.seq) {
            const current = state.lastSeqBySession.get(sessionID) || 0;
            if (msg.seq > current) {
                state.lastSeqBySession.set(sessionID, msg.seq);
                if (state.localStoreReady && state.userId && sessionID) {
                    persist(window.LinkGoStore.putCursor(state.userId, sessionID, {
                        last_seq: msg.seq,
                        acked_seq: state.lastAckedSeqBySession.get(sessionID) || 0
                    }), "保存本地会话游标");
                }
            }
            updateCurrentMeta();
        }

        const row = document.createElement("div");
        const isSelf = msg.from === state.userId;
        const isAI = isAIUser(msg.from);
        row.className = `msg ${isSelf ? "self" : "other"}`;
        if (msg.client_msg_id) row.dataset.clientMsgId = msg.client_msg_id;
        const meta = [
            msg.from || state.userId || "-",
            msg.seq ? `seq:${msg.seq}` : "",
            msg.client_msg_id ? `cid:${msg.client_msg_id}` : "",
            options.pending ? "pending" : ""
        ].filter(Boolean).join(" ");

        row.innerHTML = `
            <div class="avatar ${msg.to_type === "group" ? "group" : isAI ? "ai" : ""}">${isAI ? "AI" : shortId(msg.from || state.userId)}</div>
            <div>
                <div class="meta"></div>
                <div class="bubble"></div>
            </div>
        `;
        row.querySelector(".meta").textContent = meta;
        const bubble = row.querySelector(".bubble");
        const attachment = parseAttachmentBody(msg.body);
        if (attachment) {
            bubble.replaceChildren();
            const label = document.createElement("span");
            label.textContent = `📎 ${attachment.file_name} (${formatBytes(attachment.size)}) `;
            bubble.appendChild(label);
            const open = document.createElement("button");
            open.type = "button";
            open.textContent = "查看/下载";
            open.onclick = () => void openAttachment(attachment.attachment_id, attachment.file_name, attachment.mime_type);
            bubble.appendChild(open);
        } else {
            bubble.textContent = msg.body || "";
        }
        if ((msg.body || "").includes("task://")) {
            row.querySelector(".bubble").style.cursor = "pointer";
            row.querySelector(".bubble").title = "打开学习任务";
            row.querySelector(".bubble").onclick = () => window.LinkGoTasks.openFromMessage(msg.body || "");
        }
        if (msg.seq > 0) {
            row.dataset.seq = String(msg.seq);
            const next = [...box.querySelectorAll(".msg[data-seq]")]
                .find((item) => Number(item.dataset.seq) > Number(msg.seq));
            if (next) box.insertBefore(row, next);
            else box.appendChild(row);
        } else {
            box.appendChild(row);
        }
        if (!options.preserveScroll) box.scrollTop = box.scrollHeight;
    }

        if (!button) return;

        if ($("messages").scrollTop <= 32

    async function login() {
        try {
            const payload = await apiFetch("/api/v1/login", {
                method: "POST",
                body: {
                    username: $("username").value.trim(),
                    password: $("password").value
                }
            });
            state.token = payload.token;//这里已经完成jwt了
            state.userId = payload.user_id;
            state.currentTarget = "";
            state.currentType = "user";
            window.LinkGoTasks.reset();
            state.conversations.clear();
            state.lastSeqBySession.clear();
            state.lastAckedSeqBySession.clear();
            state.historyCursorBySession.clear();
            state.historyHasMoreBySession.clear();
            state.historySyncedSeqBySession.clear();
            state.historySyncReady = false;
            state.historySyncPromise = null;
            state.historySyncEpoch += 1;
            state.friendMeta.clear();
            await restoreLocalState();
            for (const conv of payload.conversations || []) {
                const target = targetFromConversation(conv);
                if (target) {
                    addConversation(target, conv.type, {
                        title: conv.title || target,
                        last_msg: conv.last_msg,
                        last_seq: conv.last_seq,
                        acked_seq: conv.acked_seq,
                        updated_at: conv.updated_at
                    });
                    state.lastSeqBySession.set(conv.conversation_id, conv.last_seq || 0);
                    state.lastAckedSeqBySession.set(conv.conversation_id, conv.acked_seq || 0);
                    if (state.localStoreReady) {
                        persist(window.LinkGoStore.putCursor(state.userId, conv.conversation_id, {
                            last_seq: conv.last_seq || 0,
                            acked_seq: conv.acked_seq || 0
                        }), "同步服务端会话游标");
                    }
                }
            }
            setStatus("warn", `已登录 ${state.userId}`);
            log("ok", "登录成功", { user_id: state.userId });
            connectWebSocket();
            await Promise.allSettled([refreshFriends(), refreshRequests(), refreshGroups()]);
            const first = [...state.conversations.values()][0] || state.friends[0] && { target: state.friends[0].user_id, type: "user" };
            if (first && !state.currentTarget) {
                setCurrent(first.target, first.type);
                await loadHistory();
            } else {
                renderLists();
            }
            state.historySyncReady = true;
            void syncKnownHistory();
            log("info", "登录初始化完成");
        } catch (err) {
            setStatus("error", "登录失败");
            log("error", "登录失败", err.message);
        }
    }

    async function connectWebSocket() {
        if (!state.token) {
            log("warn", "缺少 token，无法连接 WebSocket");
            return;
        }
        state.intentionalClose = true;
        if (state.reconnectTimer) {
            clearTimeout(state.reconnectTimer);
            state.reconnectTimer = null;
        }
        if (state.ws) state.ws.close();
        if (state.heartbeatTimer) clearInterval(state.heartbeatTimer);

        const serial = ++state.wsConnectionSerial;
        let ticket;
        try {
            const issued = await apiFetch("/api/v1/ws-ticket", { method: "POST" });
            ticket = issued.ticket;
            if (!ticket) throw new Error("服务器未返回 WebSocket 凭证");
        } catch (err) {
            if (serial === state.wsConnectionSerial) {
                log("error", "获取 WebSocket 凭证失败", err.message);
                scheduleReconnect();
            }
            return;
        }
        if (serial !== state.wsConnectionSerial || !state.token) return;

        const sessionID = buildSessionId(state.currentTarget, state.currentType);
        const lastSeq = state.lastAckedSeqBySession.get(sessionID);
        const query = new URLSearchParams({ ticket });
        if (sessionID) {
            query.set("session_id", sessionID);
            query.set("last_seq", String(lastSeq === undefined ? -1 : lastSeq));
        }

        const ws = new WebSocket(`${wsBase()}/ws?${query.toString()}`);
        state.ws = ws;
        ws.binaryType = "arraybuffer";
        setStatus("warn", "连接中");

        ws.onopen = () => {
            state.reconnectAttempt = 0;
            state.intentionalClose = false;
            state.lastPongAt = Date.now();
            setStatus("ok", `在线 ${state.userId}`);
            log("ok", "WebSocket 已连接");
            startHeartbeat();
            if (state.historySyncReady) void syncKnownHistory();
        };
        ws.onmessage = (event) => { void handleWsMessage(event.data); };
        ws.onerror = () => log("error", "WebSocket 错误");
        ws.onclose = () => {
            if (state.ws === ws) {
                state.ws = null;
                setStatus("error", state.token ? "已断开" : "离线");
                log("warn", "WebSocket 已断开");
                if (state.token && !state.intentionalClose) scheduleReconnect();
            }
        };
    }

    function scheduleReconnect() {
        if (!state.token || state.reconnectTimer) return;
        const attempt = state.reconnectAttempt++;
        const base = Math.min(30000, 1000 * (2 ** Math.min(attempt, 5)));
        const delay = Math.round(base * (0.8 + Math.random() * 0.4));
        setStatus("warn", `断线重连中 ${Math.round(delay / 1000)}s`);
        log("warn", "安排 WebSocket 重连", { attempt: attempt + 1, delay_ms: delay });
        state.reconnectTimer = window.setTimeout(() => {
            state.reconnectTimer = null;
            if (state.token) connectWebSocket();
        }, delay);
    }

    window.addEventListener("online", () => {
        if (state.token && !state.ws) {
            state.reconnectAttempt = 0;
            scheduleReconnect();
        }
    });

    function startHeartbeat() {
        if (state.heartbeatTimer) clearInterval(state.heartbeatTimer);
        state.heartbeatTimer = setInterval(() => {
            const ws = state.ws;
            if (!ws || ws.readyState !== WebSocket.OPEN) return;
            if (Date.now() - state.lastPongAt > 45000) {
                log("warn", "心跳超时，关闭连接");
                ws.close();
                return;
            }
            const sessionID = buildSessionId(state.currentTarget, state.currentType);
            ws.send(encodeWireMessage({
                msg_type: 1,
                session_id: sessionID,
                last_seq: state.lastAckedSeqBySession.get(sessionID) || 0,
                sent_at: Date.now(),
                trace_id: newId("hb")
            }));
        }, 20000);
    }

    async function handleWsMessage(data) {
        if (typeof data === "string") {
            log("info", "收到文本消息", data);
            return;
        }
        try {
            const msg = decodeWireMessage(data);
            if (msg.msg_type === 1) {
                state.lastPongAt = Date.now();
                return;
            }
            if (msg.msg_type === 3) {
                if (handleSystemMessage(msg)) return;
                log("info", "收到系统消息", msg.body || msg.message_id || "");
                return;
            }

            clearPendingMessage(msg.client_msg_id);

            // Persist every conversation, including one that is not currently
            // visible, before acknowledging a received message to the server.
            const sessionID = sessionOfMessage(msg);
            if (state.localStoreReady && state.userId && sessionID) {
                await window.LinkGoStore.putMessage(state.userId, sessionID, msg, "received");
            }

            const peer = peerOfMessage(msg);
            addConversation(peer, msg.to_type || "user", {
                title: displayName(peer, peer),
                last_msg: msg.body,
                last_seq: msg.seq,
                updated_at: msg.sent_at || Date.now()
            });
            renderLists();
            if (peer === state.currentTarget || sessionOfMessage(msg) === buildSessionId(state.currentTarget, state.currentType)) {
                renderMessage(msg, { skipPersist: true });
            }
            ackMessage(msg);
            window.LinkGoTasks.onMessage(msg.body || "");
            log("ok", "收到消息", {
                from: msg.from,
                to: msg.to,
                seq: msg.seq,
                message_id: msg.message_id
            });
        } catch (err) {
            log("error", "消息处理或本地保存失败，暂不 ACK", err.message);
        }
    }

    function handleSystemMessage(msg) {
        let detail;
        try {
            detail = JSON.parse(msg.body || "{}");
        } catch {
            return false;
        }
        const clientMsgID = msg.client_msg_id || "";
        if (detail.type === "result" && detail.code === "MESSAGE_ACCEPTED") {
            clearPendingMessage(clientMsgID);
            markPendingMessageState(clientMsgID, "accepted");
            if (state.localStoreReady) {
                persist(window.LinkGoStore.updateOutgoingStatus(state.userId, clientMsgID, "accepted"), "更新本地发送状态");
            }
            log("ok", "消息已被 Logic 接受", { client_msg_id: clientMsgID });
            return true;
        }
        if (detail.type !== "error") return false;

        const rejectionLabel = detail.code === "MESSAGE_REJECTED"
            ? "消息未被 Logic 接受"
            : "消息被网关拒绝";
        log(detail.retryable ? "warn" : "error", `${rejectionLabel}: ${detail.code || "UNKNOWN"}`, {
            client_msg_id: clientMsgID,
            retryable: Boolean(detail.retryable),
            message: detail.message || ""
        });
        if (detail.retryable && clientMsgID) {
            scheduleMessageRetry(clientMsgID, Number(detail.retry_after_ms) || 0);
        } else {
            clearPendingMessage(clientMsgID);
            markPendingMessageState(clientMsgID, "rejected");
            if (state.localStoreReady) {
                persist(window.LinkGoStore.updateOutgoingStatus(state.userId, clientMsgID, "rejected"), "更新本地发送状态");
            }
        }
        return true;
    }

    function scheduleMessageRetry(clientMsgID, serverDelayMS) {
        const pending = state.pendingMessages.get(clientMsgID);
        if (!pending || pending.timer) return;
        if (pending.attempts >= 5) {
            state.pendingMessages.delete(clientMsgID);
            log("error", "消息重试次数已达上限", { client_msg_id: clientMsgID });
            return;
        }

        pending.attempts += 1;
        const exponentialMS = Math.min(5000, 250 * (2 ** (pending.attempts - 1)));
        const jitteredMS = Math.round(exponentialMS * (0.5 + Math.random() * 0.5));
        const delayMS = Math.max(serverDelayMS, jitteredMS);
        pending.timer = window.setTimeout(() => {
            pending.timer = null;
            const ws = state.ws;
            if (!ws || ws.readyState !== WebSocket.OPEN) {
                state.pendingMessages.delete(clientMsgID);
                log("error", "连接不可用，停止消息重试", { client_msg_id: clientMsgID });
                return;
            }
            ws.send(encodeWireMessage(pending.wire));
            log("warn", "服务繁忙，自动重试消息", {
                client_msg_id: clientMsgID,
                attempt: pending.attempts,
                delay_ms: delayMS
            });
        }, delayMS);
    }

    function clearPendingMessage(clientMsgID) {
        if (!clientMsgID) return;
        const pending = state.pendingMessages.get(clientMsgID);
        if (pending && pending.timer) window.clearTimeout(pending.timer);
        state.pendingMessages.delete(clientMsgID);
    }

    function markPendingMessageState(clientMsgID, nextState) {
        if (!clientMsgID) return;
        for (const row of document.querySelectorAll(".msg[data-client-msg-id]")) {
            if (row.dataset.clientMsgId !== clientMsgID) continue;
            const meta = row.querySelector(".meta");
            if (!meta) continue;
            const tokens = meta.textContent.split(/\s+/).filter((token) =>
                token && token !== "pending" && token !== "accepted" && token !== "rejected"
            );
            if (nextState) tokens.push(nextState);
            meta.textContent = tokens.join(" ");
        }
    }

    function ackMessage(msg) {
        if (!msg.message_id || msg.from === state.userId) return;
        const ws = state.ws;
        if (!ws || ws.readyState !== WebSocket.OPEN) return;
        ws.send(encodeWireMessage({
            msg_type: 2,
            ack_message_id: msg.message_id,
            sent_at: Date.now(),
            trace_id: newId("ack")
        }));
        const sessionID = sessionOfMessage(msg);
        const current = state.lastAckedSeqBySession.get(sessionID) || 0;
        if (msg.seq > current) {
            state.lastAckedSeqBySession.set(sessionID, msg.seq);
            if (state.localStoreReady) {
                persist(window.LinkGoStore.putCursor(state.userId, sessionID, {
                    last_seq: Math.max(msg.seq, state.lastSeqBySession.get(sessionID) || 0),
                    acked_seq: msg.seq
                }), "保存本地 ACK 游标");
            }
        }
    }

    async function syncOneConversation(userID, token, conversation) {
        const sessionID = buildSessionId(conversation.target, conversation.type);
        if (!sessionID) return 0;
        const previousSeq = state.historySyncedSeqBySession.get(sessionID) || 0;
        const result = await window.LinkGoHistorySync.collectMissingPages(async (beforeSeq) => {
            if (state.userId !== userID || state.token !== token) return { data: [] };
            const params = new URLSearchParams({ target_id: conversation.target, limit: "100" });
            if (beforeSeq > 0) params.set("before_seq", String(beforeSeq));
            return apiFetch(`/api/v1/history?${params.toString()}`);
        }, previousSeq);
        if (state.userId !== userID || state.token !== token || !result.messages.length) return 0;
        await window.LinkGoStore.saveHistoryRange(userID, sessionID, result.messages, result.newestSeq);
        state.historySyncedSeqBySession.set(sessionID, result.newestSeq);
        log("ok", "会话历史补齐并保存", {
            session_id: sessionID,
            added: result.added,
            checked: result.messages.length,
            pages: result.pages,
            synced_seq: result.newestSeq
        });
        if (sessionID === buildSessionId(state.currentTarget, state.currentType)) {
            await loadHistory({ latest: true });
        }
        return result.added;
    }

    function syncKnownHistory() {
        if (!state.historySyncReady || !state.localStoreReady || !state.userId || !state.token) {
            return Promise.resolve(0);
        }
        if (state.historySyncPromise) return state.historySyncPromise;
        const userID = state.userId;
        const token = state.token;
        const epoch = state.historySyncEpoch;
        const conversations = [...state.conversations.values()];
        const running = (async () => {
            let added = 0;
            for (const conversation of conversations) {
                if (state.userId !== userID || state.token !== token) break;
                try {
                    added += await syncOneConversation(userID, token, conversation);
                } catch (error) {
                    log("warn", "会话历史补齐失败，下次可重试", {
                        target: conversation.target,
                        error: error.message || String(error)
                    });
                }
            }
            log("info", "已检查已知会话历史", { conversations: conversations.length, added });
            return added;
        })().finally(() => {
            if (state.historySyncEpoch === epoch) state.historySyncPromise = null;
        });
        state.historySyncPromise = running;
        return running;
    }

    async function loadHistory(options = {}) {
        if (!state.token || !state.currentTarget) return;
        const sessionID = buildSessionId(state.currentTarget, state.currentType);
        const targetID = state.currentTarget;
        const beforeSeq = options.latest
            ? 0
            : (options.beforeSeq || (options.older ? state.historyCursorBySession.get(sessionID) || 0 : 0));
        if (options.older && beforeSeq <= 0) return;
        if (state.historyLoadingSessions.has(sessionID)) return;
        state.historyLoadingSessions.add(sessionID);
        updateHistoryButton(sessionID);
        const requestSerial = ++state.historyRequestSerial;
        if (options.latest) state.historyCursorBySession.delete(sessionID);
        const params = new URLSearchParams({ target_id: targetID });
        if (beforeSeq > 0) params.set("before_seq", String(beforeSeq));
        params.set("limit", "50");
        try {
            const payload = await apiFetch(`/api/v1/history?${params.toString()}`);
            const data = Array.isArray(payload.data) ? payload.data : [];
            const localMessages = await reconcileServerPage(sessionID, data);
            if (requestSerial !== state.historyRequestSerial
                || sessionID !== buildSessionId(state.currentTarget, state.currentType)) return;
            if (!beforeSeq) {
                const display = window.LinkGoHistorySync.mergeLatestPage(data, localMessages);
                renderMessages(display);
            } else {
                const box = $("messages");
                const oldHeight = box.scrollHeight;
                const oldTop = box.scrollTop;
                for (const msg of data) {
                    renderMessage(msg, {
                        fromHistory: true,
                        pending: msg.status === "pending",
                        preserveScroll: true
                    });
                }
                box.scrollTop = oldTop + (box.scrollHeight - oldHeight);
            }
            state.historyHasMoreBySession.set(sessionID, Boolean(payload.has_more));
            if (payload.has_more && payload.next_before_seq) {
                state.historyCursorBySession.set(sessionID, payload.next_before_seq);
            }
            updateHistoryButton(sessionID);
            log("ok", beforeSeq ? "历史上一页加载完成" : "历史加载完成", {
                target_id: targetID,
                count: data.length,
                has_more: Boolean(payload.has_more)
            });
        } catch (err) {
            if (requestSerial !== state.historyRequestSerial
                || sessionID !== buildSessionId(state.currentTarget, state.currentType)) return;
            log("error", "历史加载失败", err.message);
            try {
                await renderLocalHistory(sessionID, err.message);
            } catch (localError) {
                log("error", "本地历史读取失败", localError.message);
            }
        } finally {
            state.historyLoadingSessions.delete(sessionID);
            if (sessionID === buildSessionId(state.currentTarget, state.currentType)) updateHistoryButton(sessionID);
        }
    }

    function sendMessage(reuseLast = false) {
        const ws = state.ws;
        if (!ws || ws.readyState !== WebSocket.OPEN) {
            log("error", "WebSocket 未连接");
            return;
        }
        if (!state.currentTarget) {
            log("warn", "未选择目标");
            return;
        }

        let wire = state.lastWire;
        if (!reuseLast || !wire) {
            const text = $("message-input").value.trim();
            if (!text) return;
            const clientMsgID = $("client-msg-id").value.trim() || newId("cmid");
            wire = {
                from: state.userId,
                to: state.currentTarget,
                to_type: state.currentType,
                msg_type: 0,
                body: text,
                sent_at: Date.now(),
                client_msg_id: clientMsgID,
                trace_id: newId("trace")
            };
            state.lastWire = wire;
            $("client-msg-id").value = "";
            $("message-input").value = "";
            renderMessage(wire, { pending: true });
        }

        ws.send(encodeWireMessage(wire));
        const existing = state.pendingMessages.get(wire.client_msg_id);
        if (!existing) {
            state.pendingMessages.set(wire.client_msg_id, { wire, attempts: 0, timer: null });
        }
        if (state.localStoreReady) {
            persist(
                window.LinkGoStore.putMessage(state.userId, buildSessionId(state.currentTarget, state.currentType), wire, "pending"),
                "保存本地发送箱"
            );
        }
        addConversation(state.currentTarget, state.currentType, {
            title: state.currentType === "group" ? state.currentTarget : displayName(state.currentTarget),
            last_msg: wire.body,
            updated_at: Date.now()
        });
        renderLists();
        log("info", reuseLast ? "已用相同 clientMsgId 重发" : "消息已提交至网关", {
            to: wire.to,
            to_type: wire.to_type,
            client_msg_id: wire.client_msg_id
        });
        window.setTimeout(loadHistory, 900);
    }

    function parseAttachmentBody(body) {
        try {
            const value = JSON.parse(body || "");
            return value && value.kind === "attachment" && value.attachment_id ? value : null;
        } catch { return null; }
    }

    function formatBytes(value) {
        const size = Number(value) || 0;
        return size < 1024 * 1024 ? `${Math.ceil(size / 1024)} KB` : `${(size / 1024 / 1024).toFixed(1)} MB`;
    }

    async function openAttachment(id, name, mimeType) {
        const response = await fetch(`${apiBase()}/api/v1/attachments/${encodeURIComponent(id)}/download`, {
            headers: { Authorization: `Bearer ${state.token}` }
        });
        if (!response.ok) throw new Error("附件暂不可用或当前账号没有群权限");
        const blob = await response.blob();
        const url = URL.createObjectURL(new Blob([blob], { type: mimeType || blob.type }));
        if ((mimeType || blob.type).startsWith("image/")) {
            const image = window.open(url, "_blank", "noopener");
            if (!image) log("warn", "浏览器拦截了图片预览，请允许弹窗");
        } else {
            const anchor = document.createElement("a");
            anchor.href = url; anchor.download = name || "download"; anchor.click();
        }
        window.setTimeout(() => URL.revokeObjectURL(url), 60000);
    }

        const data = await uploadAttachmentForGroup(state.currentTarget, file);
        $("message-input").value = JSON.stringify({
            kind: "attachment", attachment_id: data.attachment_id,
            file_name: data.file_name, mime_type: data.mime_type, size: data.size
        });
        sendMessage(false);
    }

    async function checkReady() {
        try {
            const payload = await apiFetch("/readyz");
            log("ok", "readyz", payload);
        } catch (err) {
            log("error", "readyz 失败", err.message);
        }
    }

    function newId(prefix) {
        const random = Math.random().toString(16).slice(2, 10);
        return `${prefix}-${state.userId || "u"}-${Date.now()}-${random}`;
    }

    function formatFen(value) {
        const amount = Number(value || 0) / 100;
        return `${amount.toFixed(2)}元`;
    }

    function switchTab(tab) {
        document.querySelectorAll(".tab").forEach((el) => el.classList.toggle("active", el.dataset.tab === tab));
        document.querySelectorAll(".list").forEach((el) => el.classList.toggle("active", el.id === `${tab}-list`));
    }

    function openPeerChat() {
        const peer = state.userId === "1002" ? "1001" : "1002";
        addConversation(peer, "user", { title: displayName(peer, peer) });
        setCurrent(peer, "user");
        loadHistory();
    }

    function openAIChat() {
        addConversation(AI_BOT_ID, "user", { title: AI_BOT_NAME });
        setCurrent(AI_BOT_ID, "user");
        loadHistory();
    }

    function fillDemoMessage() {
        if (isAIUser(state.currentTarget)) {
            $("message-input").value = "项目里 Redis 用来做什么？";
            return;
        }
        if (state.currentType === "group") {
            $("message-input").value = "/summary";
            return;
        }
        $("message-input").value = `你好，这是一条前端联调消息 ${nowText()}`;
    }

    window.LinkGoTasks.init({
        request: apiFetch,
        upload: uploadAttachmentForGroup,
        openAttachment,
        log: (message) => log("info", message),
        getUserID: () => state.userId
    });
    $("login-btn").onclick = login;
    $("connect-btn").onclick = connectWebSocket;
    $("open-peer-btn").onclick = openPeerChat;
    $("open-ai-btn").onclick = openAIChat;
    $("fill-demo-btn").onclick = fillDemoMessage;
    $("local-data-btn").onclick = async () => {
        if (!state.userId || !state.localStoreReady) {
            log("warn", "请先登录并初始化 IndexedDB");
            return;
        }
        try {
            log("info", "IndexedDB 本地数据统计", await window.LinkGoStore.stats(state.userId));
        } catch (error) {
            log("error", "读取本地数据统计失败", error.message);
        }
    };
    $("sync-history-btn").onclick = () => { void syncKnownHistory(); };
    $("ready-btn").onclick = checkReady;
    $("apply-btn").onclick = applyFriend;
    $("friends-btn").onclick = () => Promise.allSettled([refreshFriends(), refreshRequests()]);
    $("groups-btn").onclick = refreshGroups;
    $("create-group-btn").onclick = createGroup;
    $("wallet-recharge-btn").onclick = rechargeWallet;
    $("wallet-detail-btn").onclick = detailWallet;
    $("red-packet-create-btn").onclick = createRedPacket;
    $("red-packet-claim-btn").onclick = claimRedPacket;
    $("red-packet-detail-btn").onclick = detailRedPacket;
    $("red-packet-refund-btn").onclick = refundRedPacket;
    $("open-chat-btn").onclick = () => {
        const target = $("target-id").value.trim();
        const type = $("target-type").value;
        if (!target) return;
        addConversation(target, type, { title: target });
        setCurrent(target, type);
        loadHistory();
        if (type === "group") loadGroupMembers(target);
    };
    $("history-btn").onclick = () => { void loadHistory({ older: true }); };
    $("send-btn").onclick = () => sendMessage(false);
    $("resend-btn").onclick = () => sendMessage(true);
    $("attach-file-btn").onclick = () => $("attach-file-input").click();
    $("attach-file-input").onchange = (event) => {
        const file = event.target.files && event.target.files[0];
        if (file) void uploadGroupAttachment(file).catch((error) => log("error", "附件上传失败", error.message));
        event.target.value = "";
    };
    $("message-input").onkeydown = (event) => {
        if (event.key === "Enter" && !event.shiftKey) {
            event.preventDefault();
            sendMessage(false);
        }
    };
    document.querySelectorAll("[data-account]").forEach((btn) => {
        btn.onclick = () => {
            $("username").value = btn.dataset.account;
            $("password").value = "123456";
        };
    });
    document.querySelectorAll(".tab").forEach((btn) => {
        btn.onclick = () => switchTab(btn.dataset.tab);
    });

    log("info", "页面已就绪");
})();
</script>
</body>
</html>
